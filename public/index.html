<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Suppress third-party Chrome Extension & MetaMask errors before Webpack Overlay loads -->
    <script>
      (function () {
        function shouldIgnore(err) {
          if (!err) return false;
          var str = '';
          try {
            str = (err.message || '') + ' ' + (err.stack || '') + ' ' + String(err);
          } catch (e) {}
          return (
            str.indexOf('MetaMask') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1
          );
        }

        window.addEventListener(
          'error',
          function (e) {
            if (
              shouldIgnore(e.error) ||
              shouldIgnore(e.message) ||
              (e.filename && e.filename.indexOf('chrome-extension://') !== -1)
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            if (shouldIgnore(e.reason)) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          },
          true
        );
      })();
    </script>
    <style>
      /* Hide Webpack Dev Server error overlay for external browser extension errors */
      iframe#webpack-dev-server-client-overlay,
      #webpack-dev-server-client-overlay {
        display: none !important;
      }
    </style>
    <meta charset="utf-8" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS (Play CDN for instant utility classes without build pipeline friction) -->

      tailwind.config = {

          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],

          },
        },
      };
    </script>

    <title>WorkPulse - Employee Attendance Portal</title>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
